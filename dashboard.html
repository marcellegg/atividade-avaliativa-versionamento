<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #fff;
            margin: 0;
        }
        nav {
            background-color: #1f1f1f;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        nav div a {
            color: #fff;
            text-decoration: none;
            margin-right: 20px;
            font-weight: bold;
        }
        nav div a:hover {
            color: #00bfa5;
        }
        .btn-sair {
            color: #ff5252;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            padding: 50px;
            text-align: center;
        }
        h1 {
            color: #00bfa5;
        }
    </style>
</head>
<body>

    <!-- Menu simples -->
    <nav>
        <div>
            <a href="#">Início</a>
            <a href="#">Meu Perfil</a>
            <a href="#">Configurações</a>
        </div>
        <a href="index.html" class="btn-sair">Sair</a>
    </nav>

    <!-- Mensagem de boas-vindas -->
    <div class="container">
        <h1 id="boasVindas">Bem-vindo ao seu Painel!</h1>
        <p>Aqui você encontra as principais informações após realizar o login.</p>
    </div>

    <script>
        // Este pequeno script recupera o nome do utilizador guardado no passo anterior
        const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
        if (usuarioLogado && usuarioLogado.nome) {
            document.getElementById("boasVindas").textContent = `Bem-vindo, ${usuarioLogado.nome}!`;
        }
    </script>
</body>
</html>
