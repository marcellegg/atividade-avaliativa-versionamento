<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<style>
  :root {
    --bg: #f4f5f7;
    --sidebar-bg: #1f2937;
    --sidebar-text: #e5e7eb;
    --sidebar-active: #374151;
    --accent: #3b82f6;
    --card-bg: #ffffff;
    --text-main: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    padding: 24px 0;
    flex-shrink: 0;
  }

  .sidebar .logo {
    font-size: 1.3rem;
    font-weight: 700;
    padding: 0 24px 24px 24px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 16px;
  }

  .sidebar nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .sidebar nav a {
    color: var(--sidebar-text);
    text-decoration: none;
    padding: 12px 24px;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s ease;
  }

  .sidebar nav a:hover {
    background: var(--sidebar-active);
  }

  .sidebar nav a.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }

  .sidebar .logout {
    margin-top: auto;
    padding: 12px 24px;
  }

  .sidebar .logout button {
    width: 100%;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    color: var(--sidebar-text);
    padding: 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .sidebar .logout button:hover {
    background: rgba(255,255,255,0.1);
  }

  /* Main content */
  .main {
    flex: 1;
    padding: 32px 40px;
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 32px;
  }

  .welcome h1 {
    margin: 0 0 4px 0;
    font-size: 1.6rem;
  }

  .welcome p {
    margin: 0;
    color: var(--text-muted);
  }

  .user-badge {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: 999px;
  }

  .user-badge .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.85rem;
  }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 20px;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .card h3 {
    margin: 0 0 8px 0;
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .card .value {
    font-size: 1.8rem;
    font-weight: 700;
  }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">Meu Sistema</div>
    <nav>
      <a href="#" class="active" data-page="inicio">🏠 Início</a>
      <a href="#" data-page="perfil">👤 Perfil</a>
      <a href="#" data-page="relatorios">📊 Relatórios</a>
      <a href="#" data-page="configuracoes">⚙️ Configurações</a>
    </nav>
    <div class="logout">
      <button id="logoutBtn">Sair</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="welcome">
        <h1 id="welcomeMsg">Bem-vindo(a)!</h1>
        <p>Aqui está um resumo da sua conta.</p>
      </div>
      <div class="user-badge">
        <div class="avatar" id="userAvatar">?</div>
        <span id="userNameLabel">Usuário</span>
      </div>
    </div>

    <section class="cards">
      <div class="card">
        <h3>Status</h3>
        <div class="value">Ativo</div>
      </div>
      <div class="card">
        <h3>Último acesso</h3>
        <div class="value" id="lastAccess">--</div>
      </div>
      <div class="card">
        <h3>Notificações</h3>
        <div class="value">0</div>
      </div>
    </section>
  </main>

  <script>
    // Simulação simples de autenticação.
    // Troque esta parte pela integração real (sessão, token JWT, API, etc).
    function getUsuarioAutenticado() {
      const salvo = localStorage.getItem("usuarioLogado");
      if (salvo) return JSON.parse(salvo);

      // fallback de exemplo caso não haja usuário salvo
      const usuarioExemplo = { nome: "Marcele" };
      localStorage.setItem("usuarioLogado", JSON.stringify(usuarioExemplo));
      return usuarioExemplo;
    }

    const usuario = getUsuarioAutenticado();

    document.getElementById("welcomeMsg").textContent = `Bem-vindo(a), ${usuario.nome}!`;
    document.getElementById("userNameLabel").textContent = usuario.nome;
    document.getElementById("userAvatar").textContent = usuario.nome.charAt(0).toUpperCase();
    document.getElementById("lastAccess").textContent = new Date().toLocaleString("pt-BR");

    // Menu: marca item ativo ao clicar
    document.querySelectorAll(".sidebar nav a").forEach(link => {
      link.addEventListener("click", (e) => {
        e.preventDefault();
        document.querySelectorAll(".sidebar nav a").forEach(a => a.classList.remove("active"));
        link.classList.add("active");
        // Aqui você pode trocar o conteúdo do <main> conforme a página escolhida
      });
    });

    // Logout simples (exemplo)
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("usuarioLogado");
      alert("Sessão encerrada (exemplo). Redirecionar para tela de login aqui.");
    });
  </script>

</body>
</html>
