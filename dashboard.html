<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <aside class="sidebar">
    <div class="logo">Meu Sistema</div>
    <nav>
      <a href="#" class="active" data-page="inicio">🏠 Início</a>
      <a href="#" data-page="perfil">👤 Perfil</a>
      <a href="#" data-page="relatorios">📊 Relatórios</a>
      <a href="#" data-page="configuracoes">⚙️ Configurações</a>
    </nav>
    <div class="logout">
      <button id="logoutBtn">Sair</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="welcome">
        <h1 id="welcomeMsg">Bem-vindo(a)!</h1>
        <p>Aqui está um resumo da sua conta.</p>
      </div>
      <div class="user-badge">
        <div class="avatar" id="userAvatar">?</div>
        <span id="userNameLabel">Usuário</span>
      </div>
    </div>

    <section class="cards">
      <div class="card">
        <h3>Status</h3>
        <div class="value">Ativo</div>
      </div>
      <div class="card">
        <h3>Último acesso</h3>
        <div class="value" id="lastAccess">--</div>
      </div>
      <div class="card">
        <h3>Notificações</h3>
        <div class="value">0</div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
